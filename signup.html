<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Constarration</title>
    <link rel="stylesheet" href="signup.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-wrapper">
        <h1 class="site-title">Constarration</h1>

        <div class="signup-card">
            <h2>Create Account</h2>

            <p class="social-title">Sign up with</p>

            <div class="social-buttons">
                <button type="button" class="social-btn google" data-provider="Google">Google</button>
                <button type="button" class="social-btn microsoft" data-provider="Microsoft">Microsoft</button>
                <button type="button" class="social-btn yahoo" data-provider="Yahoo">Yahoo</button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <div id="auth-error" class="auth-error" style="display: none;"></div>

            <form id="signup-form">
                <div class="input-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="Choose a username" required autofocus>
                </div>

                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password (min. 4 characters)" required>
                </div>

                <button type="submit" class="signup-btn">Create Account</button>
            </form>

            <div class="links">
                <a href="login.html">Already have an account? Log in</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("signup-form");
            const errorBox = document.getElementById("auth-error");
            const userInput = document.getElementById("signup-username");
            const passInput = document.getElementById("signup-password");
            const socialBtns = document.querySelectorAll(".social-btn");

            function showError(msg) {
                errorBox.textContent = msg;
                errorBox.style.display = "block";
            }

            function hideError() {
                errorBox.style.display = "none";
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                hideError();

                const username = userInput.value.trim();
                const password = passInput.value;

                const result = Auth.signup(username, password);
                if (result.success) {
                    window.location.href = "dashboard.html";
                } else {
                    showError(result.message);
                }
            });

            socialBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const provider = btn.dataset.provider;
                    const result = Auth.loginSocial(provider);
                    if (result.success) {
                        window.location.href = "dashboard.html";
                    }
                });
            });
        });
    </script>
</body>
</html>
